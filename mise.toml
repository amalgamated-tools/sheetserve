[tools]
go = "1.27.3"
golangci-lint = "2.14.0"
# Same version as go.mod, for creating migrations.
"go:github.com/pressly/goose/v3/cmd/goose" = "3.28.0"

[env]
# Local settings and secrets. Copy .env.example to .env.
_.file = ".env"

[tasks.build]
description = "Build the sheetserve binary"
sources = [
  "go.mod",
  "go.sum",
  "cmd/**/*.go",
  "internal/**/*.go",
  "internal/**/*.html",
]
outputs = ["sheetserve"]
run = "CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o sheetserve ./cmd/server"

[tasks.run]
description = "Run the server"
run = "go run ./cmd/server"

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks."test:race"]
description = "Run unit tests with the race detector"
run = "go test -race ./..."

[tasks."test:live"]
description = "Run the live Google Sheets test (needs SHEETSERVE_LIVE_SHEET_ID and GOOGLE_APPLICATION_CREDENTIALS)"
run = "go test -count=1 -v -run TestLive ./internal/integration"

[tasks.vuln]
description = "Check for known vulnerabilities"
# ponytail: fails on stdlib vulns too; CI only fails on third-party ones.
run = "go tool govulncheck ./..."

[tasks.lint]
depends = [
  "nilaway",
  "otelkeyscheck",
  "otelkeys:alphabetized",
  "otelkeys:unused",
  "slogcheck",
  "vuln",
]
description = "Run Go linter"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format Go source"
run = "golangci-lint fmt ./..."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.tidy]
description = "Tidy go.mod and go.sum"
run = "go mod tidy"

[tasks."db:new"]
description = "Create a new SQL migration in internal/db/migrations"
usage = 'arg "<name>" help="Migration name, such as add_roles"'
run = 'goose -dir internal/db/migrations -s create "$usage_name" sql'

[tasks.check]
description = "Run vet, lint and tests"
depends = ["vet", "lint", "test"]

[tasks."docker:build"]
description = "Build the Docker image"
run = "docker build -t sheetserve ."

[tasks.clean]
description = "Remove build output"
run = "rm -f sheetserve"

[tasks.coverage]
description = "Run Go tests with coverage"
run = "go test -race -coverprofile=coverage.out -covermode=atomic ./..."

[tasks.slogcheck]
description = "Run slogcheck"
run = "go run ./cmd/slogcheck ./..."

[tasks.otelkeyscheck]
description = "Run otelkeys ordering/format checks"
run = "go run ./cmd/otelkeyscheck ./..."

[tasks."otelkeys:alphabetized"]
description = "Check alphabetized consts in each internal/otelkeys file"
run = '''
{% raw %}
#!/usr/bin/env bash
set -euo pipefail

shopt -s nullglob
files=(internal/otelkeys/*_keys.go)

if [[ ${#files[@]} -eq 0 ]]; then
  printf 'no otelkeys files found under internal/otelkeys\n' >&2
  exit 1
fi

for file in "${files[@]}"; do
  printf 'checking alphabetized constants in %s\n' "$file"
  go run ./cmd/otelkeyscheck "./$file"
done

printf 'all internal/otelkeys const blocks are alphabetized\n'
{% endraw %}
'''

[tasks."otelkeys:unused"]
description = "Fail if any const in internal/otelkeys is not referenced elsewhere"
run = '''
#!/usr/bin/env bash
set -euo pipefail

declared=$(grep -hoE '^\s+[A-Z][A-Za-z0-9_]*\s+(string\s+)?=' internal/otelkeys/*.go | awk '{print $1}' | sort -u)
# testdata holds analyzer stubs; line comments are not usage.
used=$(grep -rhE 'otelkeys\.' --include='*.go' --exclude-dir=otelkeys --exclude-dir=testdata . | grep -vE '^\s*//' | grep -oE '\botelkeys\.[A-Z][A-Za-z0-9_]*' | sed 's/^otelkeys\.//' | sort -u)

unused=$(comm -23 <(printf '%s\n' "$declared") <(printf '%s\n' "$used"))
if [[ -n "$unused" ]]; then
  printf 'unused otelkeys constants:\n%s\n' "$unused" >&2
  exit 1
fi
printf 'all %d otelkeys constants are in use\n' "$(printf '%s\n' "$declared" | wc -l | tr -d ' ')"
'''

[tasks.nilaway]
description = "Run nilaway"
run = "go tool nilaway -include-pkgs=github.com/amalgamated-tools/sheetserve -exclude-file-docstrings='Code generated' ./..."

[tasks.hardfmt]
description = "Run hardfmt"
run = "go tool gofumpt -w -l ."
