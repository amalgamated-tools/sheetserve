name: Build Container

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
  # Release builds are driven by release-please (.github/workflows/release-please.yml),
  # not by the `release: published` event: release-please creates the release with a
  # token whose events may not re-trigger workflows, so the release job calls this
  # workflow directly instead.
  workflow_call:
    inputs:
      ref:
        description: Git ref to build — the release tag, e.g. v1.8.0
        required: true
        type: string
      version:
        description: Release version without the leading v, e.g. 1.8.0
        required: true
        type: string
      platforms:
        description: Target platform(s)
        required: false
        default: linux/amd64
        type: string
  workflow_dispatch:
    inputs:
      platforms:
        description: Target platform(s) for this manual run
        required: false
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

env:
  REGISTRY: ghcr.io
  # GHCR requires lowercase image names
  IMAGE_NAME: ${{ github.repository }}
  # Push/release builds stay amd64-only by default; manual and release callers can
  # opt into multi-arch via the `platforms` input.
  BUILD_PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
  # Non-empty only on release builds; gates the semver/latest tags below.
  RELEASE_VERSION: ${{ inputs.version }}

# Cancel an in-progress build when a newer push arrives on the same ref.
# Release builds are never cancelled — the image must be published before
# release consumers can pull it.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ inputs.version == '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Release builds check out the tag, not the caller's branch: main may
          # already have moved past the commit release-please tagged.
          ref: ${{ inputs.ref || github.ref }}

      # QEMU is required for cross-platform builds (e.g. linux/arm64 on amd64 runners)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Lowercase IMAGE_NAME
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Set build metadata
        run: |
          echo "BUILD_VERSION=${RELEASE_VERSION:-edge}" >> "$GITHUB_ENV"
          echo "BUILD_COMMIT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Main-branch pushes publish moving `edge` + immutable `sha-<sha>` tags.
          # release-please releases publish `X.Y.Z`, `X.Y`, `X` and move `latest`.
          tags: |
            type=raw,value=edge,enable=${{ env.RELEASE_VERSION == '' && github.ref_name == github.event.repository.default_branch }}
            type=sha,enable=${{ env.RELEASE_VERSION == '' && github.ref_name == github.event.repository.default_branch }}
            # Manual runs off a feature branch: tag with the sanitized branch name so
            # the tag list is never empty (an empty list fails the push).
            type=ref,event=branch,enable=${{ env.RELEASE_VERSION == '' && github.ref_name != github.event.repository.default_branch }}
            type=semver,pattern={{version}},value=${{ inputs.ref }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.ref }},enable=${{ env.RELEASE_VERSION != '' }}
            type=semver,pattern={{major}},value=${{ inputs.ref }},enable=${{ env.RELEASE_VERSION != '' }}
            type=raw,value=latest,enable=${{ env.RELEASE_VERSION != '' }}

      # If pushes fail with 403 Forbidden, the GHCR package permissions need
      # to be configured:
      #   1. Go to https://github.com/orgs/<org>/packages and find the package.
      #      If it doesn't exist, an org admin may need to allow GITHUB_TOKEN to
      #      create packages (Settings > Actions > General > Workflow permissions >
      #      "Read and write permissions").
      #   2. Alternatively, create a PAT (classic) with write:packages scope and
      #      store it as the GHCR_TOKEN repository secret.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
            COMMIT=${{ env.BUILD_COMMIT }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
