# Fill in the GOOGLE_* and SHEETSERVE_SECRET values in the Render dashboard. See "Setup" in the README.
services:
  - type: web
    name: sheetserve
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SHEETSERVE_DB
        value: /var/data/sheetserve.db
      - key: SHEETSERVE_CACHE_TTL # Sheets allows 60 reads per minute per user
        value: 60s
      - key: SHEETSERVE_SECRET   # openssl rand -base64 32
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_PICKER_API_KEY
        sync: false
      - key: GOOGLE_PROJECT_NUMBER
        sync: false
      # OpenTelemetry: traces, metrics and logs go to OpenObserve over OTLP/HTTP.
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_EXPORTER_OTLP_ENDPOINT # the SDK appends /v1/traces, /v1/metrics and /v1/logs
        value: https://observe-sdhf.onrender.com/api/default
      - key: OTEL_EXPORTER_OTLP_HEADERS # Authorization=Basic%20<token>,stream-name=sheetserve
        sync: false
      - key: OTEL_RESOURCE_ATTRIBUTES
        value: deployment.environment.name=production
